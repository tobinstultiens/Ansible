---
- name: Homepage
  vars:
    service: "homepage"
    service_port: "3000"
    service_labels: []

  hosts: all
  become: true
  vars_files:
    - ../vars/vault.yml
    - ../vars/traefik_labels.yml

  roles:
    # Sets sonarr/radarr/lidarr/prowlarr/bazarr *_apikey facts from each service's config.
    - arr_apikeys

  tasks:
    - name: Copy css and js files
      ansible.builtin.template:
        src: ../local/homepage/{{ item }}
        dest: '{{ docker_config_dir }}/{{ service }}/{{ item }}'
        mode: "0644"
      loop:
        - custom.css
        - custom.js

    - name: Adding yaml files
      ansible.builtin.template:
        src: ../local/homepage/{{ item }}
        dest: '{{ docker_config_dir }}/{{ service }}/{{ item }}'
        mode: "0644"
      loop:
        - services.yaml
        - settings.yaml
        - bookmarks.yaml
        - docker.yaml
        - kubernetes.yaml
        - widgets.yaml

    - name: Start homepage
      community.docker.docker_container:
        image: ghcr.io/gethomepage/homepage:latest
        name: "{{ service }}"
        env:
          HOMEPAGE_ALLOWED_HOSTS: "{{ service }}.{{ DOMAIN }}"
        volumes:
          - "{{ docker_config_dir }}/{{ service }}:/app/config"
          - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
          - "{{ docker_nas_dir }}:/storage"
        restart_policy: unless-stopped
        networks:
          - name: proxy
        labels: "{{ (traefik_default_labels + service_labels) | items2dict }}"
