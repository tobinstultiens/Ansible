---
- name: Homeassistant
  vars:
    service: "homeassistant"
    service_port: "8123"
    service_labels: []
    # hass-oidc-auth (the `auth_oidc` custom component) gives HA OpenID Connect login
    # against Authelia. Watchtower only updates images, so this pin is bumped by hand:
    # https://github.com/christiaangoossens/hass-oidc-auth/releases
    hass_oidc_version: "1.1.1"
    # Reverse-proxy trust. HA no longer accepts these in configuration.yaml (see the note
    # there) — they live in the .storage/http JSON store, written by Settings > System >
    # Network. Both /16s are required: `proxy` is 172.18.0.0/16 and the default bridge is
    # 172.17.0.0/16; a /24 only covers Traefik if it lands in the first subnet. An
    # untrusted proxy makes HA ignore X-Forwarded-Proto and build http:// OIDC redirect
    # URIs that Authelia rejects, which breaks SSO.
    hass_http_managed:
      use_x_forwarded_for: true
      trusted_proxies:
        - 127.0.0.1/32
        - ::1/128
        - 172.17.0.0/16
        - 172.18.0.0/16

  hosts: all
  become: true
  vars_files:
    - ../vars/vault.yml
    - ../vars/traefik_labels.yml

  roles:
    # Sets sonarr/radarr/lidarr/prowlarr/bazarr *_apikey facts from each service's
    # config (used by secrets.yaml REST sensors + the onboarding reminder below).
    - arr_apikeys

  tasks:
    # configuration.yaml contains Home-Assistant Jinja (REST value_template,
    # !secret) and no Ansible vars, so it is copied verbatim — templating it
    # would make Ansible try to render HA's Jinja.
    - name: Copy Home Assistant configuration
      ansible.builtin.copy:
        src: ../local/homeassistant/configuration.yaml
        dest: '{{ docker_config_dir }}/{{ service }}/configuration.yaml'
        mode: "0644"
      notify: Restart homeassistant

    # These need Ansible vars (DOMAIN, vault API keys) and contain no HA Jinja.
    - name: Template Home Assistant files needing Ansible vars
      ansible.builtin.template:
        src: ../local/homeassistant/{{ item }}
        dest: '{{ docker_config_dir }}/{{ service }}/{{ item }}'
        mode: "0644"
      notify: Restart homeassistant
      loop:
        - ui-lovelace.yaml
        - secrets.yaml

    # --- .storage/http -------------------------------------------------------------
    # .storage is HA's internal state store and is normally off-limits to config
    # management (HA rewrites it at runtime, and core.config_entries / auth / the entity
    # registry carry live state and tokens). `http` is the exception worth managing: it is
    # small, self-contained, only read at start-up, holds no secrets, and its
    # reverse-proxy keys are load-bearing for Authelia SSO — too important to leave to a
    # manual UI step that a wiped /config would silently lose.
    #
    # EDIT-IN-PLACE ONLY — never synthesize this file. HA's HTTPConfigStore.async_load
    # does `self._stable = raw["stable"]` with no schema validation and no merge against
    # its defaults; its own v1->v2 migration exists specifically to guarantee "all keys
    # present ... so the load step can rely on direct key access". A hand-built store
    # missing ip_ban_enabled / ssl_profile / use_x_frame_options KeyErrors HA at boot.
    # So: read the store HA wrote, merge hass_http_managed into it, write it back. Every
    # other key — including ones a future HA version adds — is carried through untouched.
    # On a fresh /config the store does not exist yet, so the write is skipped and HA
    # creates it on first boot; the next deploy applies the proxy settings.
    - name: Read the existing Home Assistant http store
      ansible.builtin.slurp:
        src: "{{ docker_config_dir }}/{{ service }}/.storage/http"
      register: hass_http_store
      failed_when: false

    - name: Write the Home Assistant http store
      ansible.builtin.copy:
        content: "{{ hass_http_store.content | b64decode | from_json | combine({'data': {'stable': hass_http_managed}}, recursive=true) | to_nice_json }}"
        dest: "{{ docker_config_dir }}/{{ service }}/.storage/http"
        owner: root
        group: root
        mode: "0600"
      when: hass_http_store.content is defined
      notify: Restart homeassistant

    - name: Warn when the http store does not exist yet
      ansible.builtin.debug:
        msg:
          - "No .storage/http yet — Home Assistant has never run against this /config."
          - "Reverse-proxy trust was NOT applied. Finish onboarding, then re-run this"
          - "playbook to set use_x_forwarded_for + trusted_proxies. Authelia SSO will"
          - "fail until then (HA builds http:// OIDC redirect URIs behind an untrusted"
          - "proxy); HA's own local login works, which is all onboarding needs."
      when: hass_http_store.content is not defined

    # Required by the unarchive task below (not installed by default on Arch).
    - name: Ensure unzip is installed
      ansible.builtin.package:
        name: unzip
        state: present

    # The release zip holds the component's files at the archive root, so it unpacks
    # *into* custom_components/auth_oidc/ rather than alongside it.
    - name: Ensure Home Assistant custom_components dir exists
      ansible.builtin.file:
        path: '{{ docker_config_dir }}/{{ service }}/custom_components/auth_oidc'
        state: directory
        mode: "0755"

    - name: Install the OIDC auth custom component
      ansible.builtin.unarchive:
        src: >-
          https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v{{
          hass_oidc_version }}/hass-oidc-auth.zip
        dest: '{{ docker_config_dir }}/{{ service }}/custom_components/auth_oidc'
        remote_src: true
        # No `mode:` on purpose — the zip already carries 0755 dirs / 0644 files, and
        # forcing a file mode would strip +x from the component's subdirectories.
      notify: Restart homeassistant

    - name: Start homeassistant
      community.docker.docker_container:
        image: "ghcr.io/home-assistant/home-assistant:latest"
        name: "{{ service }}"
        volumes:
          - "{{ docker_config_dir }}/{{ service }}:/config"
          - "{{ docker_nas_dir }}:/storage"
          - /etc/localtime:/etc/localtime:ro
        restart_policy: unless-stopped
        privileged: true
        ports:
          - 8123:8123
        networks:
          - name: proxy
        # HA fetches Authelia's discovery document over the public URL, which does not
        # hairpin from inside Docker. host-gateway points it at the host bridge IP so the
        # request goes host :443 -> Traefik (valid Let's Encrypt cert, no TLS override
        # needed). Same trick as docker/gatus.yml.
        etc_hosts:
          "{{ 'authelia.' + DOMAIN }}": host-gateway
        # Public labels = no Authelia middleware; Home Assistant owns its own auth
        # (keeps the companion app + API working). Mirrors docker/jellyfin.yml.
        # SSO is done *inside* HA via the auth_oidc component instead — putting HA behind
        # forward-auth would break the OIDC callback as well as the companion app.
        labels: "{{ (traefik_public_labels + service_labels) | items2dict }}"

    # These integrations are config-flow only: their setup lives in HA's
    # .storage and is NOT reproduced by this playbook, so a fresh deploy needs
    # the one-time manual steps below. Full runbook: local/homeassistant/README.md
    # NOTE: this intentionally echoes plaintext API keys to the deploy output for
    # copy/paste convenience during onboarding. The keys already live unencrypted
    # in vars/vault.yml, so this adds no new exposure beyond terminal scrollback.
    - name: Remind about one-time manual integration onboarding
      ansible.builtin.debug:
        msg:
          - "Home Assistant deployed. ONE-TIME manual UI setup is required on a fresh install:"
          - "  1. https://homeassistant.{{ DOMAIN }} -> create the owner account (first run only)."
          - "     Use the SAME username as your LLDAP account, so Authelia SSO links to it"
          - "     instead of creating a second HA user (features.automatic_user_linking)."
          - "  2. Settings > Devices & Services > Add Integration (URL + credential):"
          - "       Sonarr   http://vpn:8989      key: {{ sonarr_apikey }}"
          - "       Radarr   http://vpn:7878      key: {{ radarr_apikey }}"
          - "       Lidarr   http://vpn:8686      key: {{ lidarr_apikey }}"
          - "       Jellyfin http://jellyfin:8096 (asks for your Jellyfin username/password, not a key)"
          - "       System Monitor  (enable CPU %, Memory %, Disk usage for / and /storage)"
          - "       Weather         (Met.no, no key needed)"
          - "  3. Enable the default-disabled *arr sensors (Queue, Wanted, Disk space)."
          - "  Prowlarr, Bazarr & Ombi are already configured in git (REST sensors / ombi YAML) - no UI step."
          - "  NOTE: Ombi needs `ombi_username` set in vars/vault.yml (currently '{{ ombi_username }}')."
          - "  See local/homeassistant/README.md for the full runbook."

  handlers:
    # Config files and the auth_oidc component are only read at start-up.
    - name: Restart homeassistant
      community.docker.docker_container:
        name: "{{ service }}"
        restart: true
        state: started
