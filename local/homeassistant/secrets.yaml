# Templated by docker/homeassistant.yml from vars/vault.yml.
# Consumed via `!secret <name>` in configuration.yaml (REST sensors + ombi integration).
prowlarr_apikey: "{{ prowlarr_apikey }}"
bazarr_apikey: "{{ bazarr_apikey }}"
tdarr_apikey: "{{ tdarr_apikey }}"
ombi_apikey: "{{ ombi_apikey }}"
ombi_username: "{{ ombi_username }}"

# Authelia SSO (auth_oidc). configuration.yaml is copied verbatim, so DOMAIN cannot be
# templated into it directly — these go through secrets.yaml instead. Neither value is
# actually secret: the client is public (PKCE, no client secret).
oidc_client_id: "homeassistant"
oidc_discovery_url: "https://authelia.{{ DOMAIN }}/.well-known/openid-configuration"
