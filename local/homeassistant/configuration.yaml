# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# The `proxy` network is 172.18.0.0/16 (and the default bridge 172.17.0.0/16), so these
# must be /16 — a /24 only covers Traefik if it happens to land in the first subnet, and
# an untrusted proxy makes HA ignore X-Forwarded-Proto and build http:// redirect URIs
# that the Authelia OIDC client rejects.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.17.0.0/16
    - 172.18.0.0/16

# Authelia SSO via the hass-oidc-auth custom component (installed by
# docker/homeassistant.yml into custom_components/auth_oidc). HA stays outside Traefik's
# forward-auth middleware, so this is what ties it to LLDAP/Authelia. Local HA login
# remains available behind "use an alternative login method" on the welcome screen.
# Public client: no client secret, PKCE (S256) is used instead.
auth_oidc:
  client_id: !secret oidc_client_id
  discovery_url: !secret oidc_discovery_url
  display_name: "Authelia"
  roles:
    # LLDAP group -> HA administrator. No roles.user, so any Authelia account can sign
    # in as a regular HA user.
    admin: "admins"
  features:
    # Link an SSO login to the existing HA account with the same username instead of
    # creating a duplicate. Requires the HA username to match the LLDAP one.
    automatic_user_linking: true
    automatic_person_creation: true
    # A public OIDC client requires an https redirect_uri. HA builds it from the incoming
    # request, so this stops a missed X-Forwarded-Proto from producing an http:// URI that
    # Authelia would reject.
    force_https: true

# Git-managed dashboard. Uses the non-deprecated `dashboards:` form (the old
# top-level `lovelace: mode: yaml` is removed in HA 2026.8). Layout lives in
# ui-lovelace.yaml, templated by docker/homeassistant.yml. resource_mode: yaml
# keeps Lovelace resources loaded from YAML rather than the UI resource store.
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Ombi is a YAML-only integration (no UI config flow). Reached over the `proxy`
# network via the shared `vpn` container. Creates sensor.ombi_* entities.
ombi:
  host: vpn
  port: 3579
  ssl: false
  username: !secret ombi_username
  api_key: !secret ombi_apikey

# Declarative live sensors for services that have no native HA integration.
# Prowlarr & Bazarr expose simple GET APIs; keys come from vault via secrets.yaml.
# Reached over the `proxy` network via the shared `vpn` container (same as homepage).
rest:
  - resource: "http://vpn:9696/api/v1/indexer"
    scan_interval: 300
    headers:
      X-Api-Key: !secret prowlarr_apikey
    sensor:
      - name: "Prowlarr Indexers"
        unique_id: prowlarr_indexers
        value_template: "{{ value_json | length }}"
        unit_of_measurement: "indexers"
        icon: mdi:magnify

  - resource: "http://vpn:6767/api/badges"
    scan_interval: 300
    headers:
      X-API-KEY: !secret bazarr_apikey
    sensor:
      - name: "Bazarr Wanted Subtitles"
        unique_id: bazarr_wanted_subtitles
        value_template: "{{ (value_json.episodes | int(0)) + (value_json.movies | int(0)) }}"
        unit_of_measurement: "wanted"
        icon: mdi:subtitles

# System Monitor exposes disk "use" (GB) and "free" (GB) per mount but no total.
# These template sensors compute total = use + free so the dashboard can show
# "used of total" for the system (/) and NAS (/storage) mounts.
template:
  - sensor:
      - name: "Disk total root"
        unique_id: disk_total_root
        unit_of_measurement: GiB
        icon: mdi:harddisk
        state: >-
          {{ (states('sensor.system_monitor_disk_use') | float(0))
             + (states('sensor.system_monitor_disk_free') | float(0)) }}
      - name: "Disk total storage"
        unique_id: disk_total_storage
        unit_of_measurement: GiB
        icon: mdi:nas
        state: >-
          {{ (states('sensor.system_monitor_disk_use_storage') | float(0))
             + (states('sensor.system_monitor_disk_free_storage') | float(0)) }}
