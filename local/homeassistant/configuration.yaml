# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.17.0.0/24
    - 172.18.0.0/24

# Git-managed dashboard. Uses the non-deprecated `dashboards:` form (the old
# top-level `lovelace: mode: yaml` is removed in HA 2026.8). Layout lives in
# ui-lovelace.yaml, templated by docker/homeassistant.yml. resource_mode: yaml
# keeps Lovelace resources loaded from YAML rather than the UI resource store.
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Ombi is a YAML-only integration (no UI config flow). Reached over the `proxy`
# network via the shared `vpn` container. Creates sensor.ombi_* entities.
ombi:
  host: vpn
  port: 3579
  ssl: false
  username: !secret ombi_username
  api_key: !secret ombi_apikey

# Declarative live sensors for services that have no native HA integration.
# Prowlarr & Bazarr expose simple GET APIs; keys come from vault via secrets.yaml.
# Reached over the `proxy` network via the shared `vpn` container (same as homepage).
rest:
  - resource: "http://vpn:9696/api/v1/indexer"
    scan_interval: 300
    headers:
      X-Api-Key: !secret prowlarr_apikey
    sensor:
      - name: "Prowlarr Indexers"
        unique_id: prowlarr_indexers
        value_template: "{{ value_json | length }}"
        unit_of_measurement: "indexers"
        icon: mdi:magnify

  - resource: "http://vpn:6767/api/badges"
    scan_interval: 300
    headers:
      X-API-KEY: !secret bazarr_apikey
    sensor:
      - name: "Bazarr Wanted Subtitles"
        unique_id: bazarr_wanted_subtitles
        value_template: "{{ (value_json.episodes | int(0)) + (value_json.movies | int(0)) }}"
        unit_of_measurement: "wanted"
        icon: mdi:subtitles
