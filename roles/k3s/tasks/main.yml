---
- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Deploy k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Get installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in k3s_installed_version.stdout | default('')
  changed_when: true

- name: Ensure k3s is running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_local_kubeconfig }}"
    flat: true

- name: Point kubeconfig at the server
  ansible.builtin.replace:
    path: "{{ k3s_local_kubeconfig }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_default_ipv4.address }}:6443"
    mode: "0600"
  delegate_to: localhost
  become: false
