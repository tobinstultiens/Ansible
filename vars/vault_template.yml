---
# Email for traefik and letsencrypt
email: ""
DOMAIN: ""
traefik: "/home/user/traefik/"
traefik_file: "traefik.yml"

# Authelia SSO + 2FA
# Generate secrets with: openssl rand -hex 64
authelia_jwt_secret: ""
authelia_session_secret: ""
authelia_storage_key: ""
# Authelia SMTP notifier (Gmail: use an app password from myaccount.google.com/apppasswords)
authelia_smtp_host: "smtp.gmail.com"
authelia_smtp_port: "587"
authelia_smtp_username: ""
authelia_smtp_password: ""

# Qbittorrent setup and for the script
QBT_USER: ""
QBT_PASS: ""
QBT_HOST: "IP:PORT"

# The nas information
nas_ip: ""
nas_user: ""

# Configuration location of the docker containers
docker_config_dir: "/home/user/config"
# Connection between nas and service
docker_nas: "/mnt/nas"
docker_nas_dir: "/mnt/nas/Location"
# NFS export on the NAS, mounted at docker_nas_dir
nas_nfs_export: "/volume1/Location"
# Local disk for in-progress torrents (keeps hashing off the NAS)
docker_incomplete_dir: "/home/user/incomplete"

# VPN PIA
VPN_USER: ""
VPN_PASS: ""
home: "/home/user"

# Services (auto-extracted from config files by homepage playbook where possible)
sonarr_apikey: ""
radarr_apikey: ""
lidarr_apikey: ""
prowlarr_apikey: ""
bazarr_apikey: ""
jellyfin_apikey: ""
ombi_apikey: ""
ombi_username: ""  # Ombi login username — required by the Home Assistant ombi integration
tdarr_apikey: ""

# Mealplanner: bearer token for the app (openssl rand -hex 32) and the NEVO CSV on this
# machine (copied to the server, never committed)
mealplanner_api_token: ""
mealplanner_nevo_csv: "/home/user/Projects/Personal/mealplanner/data/nevo/NEVO2025_v9.0.csv"

# Calibre-web
calibreweb_username: ""
calibreweb_password: ""

# Watchtower (auto-updater) — Discord webhook for update notifications
discord_wud_webhook: ""
# Gatus service health notifications
gatus_discord_webhook: ""
